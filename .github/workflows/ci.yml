name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: 6.10.3
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC 14)
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            qt_arch: linux_gcc_64
            package: linux-x64
          - name: Linux (Clang 18)
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            qt_arch: linux_gcc_64
          - name: Windows (MSVC)
            os: windows-latest
            cc: cl
            cxx: cl
            qt_arch: win64_msvc2022_64
            package: windows-x64

    steps:
      - uses: actions/checkout@v4

      # The project requires CMake >= 4.3, newer than the runner images ship.
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: "qtnetworkauth"
          cache: true

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Package
        if: matrix.package
        shell: bash
        run: |
          # Qt's deploy step needs an absolute prefix; `pwd -W` gives D:/... in Git Bash.
          root="$(pwd -W 2>/dev/null || pwd)"
          cmake --install build --prefix "$root/dist/plum"
          name="plum-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.package }}"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" plum >/dev/null
          else
            tar -czf "$name.tar.gz" plum
          fi

      - name: Upload package
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: plum-${{ matrix.package }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plum-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
